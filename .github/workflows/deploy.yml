name: 🚀 Deploy to VPS

# ─── TRIGGER ─────────────────────────────────────────────────────────────────
# Otomatis berjalan setiap kali ada push ke branch main
on:
  push:
    branches:
      - main

# ─── JOBS ────────────────────────────────────────────────────────────────────
jobs:
  # Job 1: Mengecek apakah ada password/kunci rahasia yang tidak sengaja ter-push
  security-scan:
    name: 🕵️‍♂️ Scan for Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ambil seluruh riwayat commit untuk dipindai
          
      - name: 🔐 Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Melakukan Deploy ke VPS
  deploy:
    name: Deploy to Production VPS
    needs: security-scan # ⚠️ Menahan proses Deploy. Hanya berjalan jika security-scan lolos (tidak ada rahasia bocor)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Tampilkan info deployment di GitHub Actions log
      - name: 📋 Deployment Info
        run: |
          echo "🚀 Deploying to 3coinsstock.com"
          echo "📦 Branch: ${{ github.ref_name }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "💬 Commit: ${{ github.event.head_commit.message }}"

      # Step 2: SSH ke VPS dan jalankan deployment secara otomatis
      - name: 🔗 SSH & Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "📁 Navigating to project directory..."
            cd ${{ secrets.VPS_PATH }}

            echo "⬇️  Pulling latest code from GitHub..."
            git pull origin main

            echo "🐳 Rebuilding and restarting Docker containers..."
            sudo docker compose down
            # --no-cache memastikan perubahan kode src/ selalu ter-compile ulang
            sudo docker compose build --no-cache
            sudo docker compose up -d

            echo "🧠 Pulling Hermes 3B model (skip jika sudah ada)..."
            # Tunggu Ollama container siap (max 30 detik)
            for i in $(seq 1 30); do
              if sudo docker compose exec -T ollama ollama list > /dev/null 2>&1; then
                break
              fi
              echo "  Menunggu Ollama siap... ($i/30)"
              sleep 1
            done
            sudo docker compose exec -T ollama ollama pull hermes3:3b || echo "⚠️ Pull Hermes gagal, akan dicoba saat runtime."

            echo "✅ Verifying containers are running..."
            sudo docker compose ps

            echo "🎉 Deployment complete!"
