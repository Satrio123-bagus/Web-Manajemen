services:
  backend:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    networks:
      - insert3coins-net

  frontend:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_TARGET=http://backend:8080
    networks:
      - insert3coins-net

networks:
  insert3coins-net:
    driver: bridge
