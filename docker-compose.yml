services:
  backend:
    build: ./server
    restart: always
    env_file:
      - ./server/.env
    environment:
      - PORT=8080
    networks:
      - insert3coins-net

  frontend:
    build: ./client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - insert3coins-net

networks:
  insert3coins-net:
    driver: bridge
