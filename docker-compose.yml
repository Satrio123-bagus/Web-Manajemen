services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
    expose:
      - "8080"
    volumes:
      - ./backend/data:/app/data
    networks:
      - insert3coins-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/ssl/cloudflare:ro  # Cloudflare Origin Certificate (read-only)
    depends_on:
      - backend
    networks:
      - insert3coins-net

networks:
  insert3coins-net:
    driver: bridge
