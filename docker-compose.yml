services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - insert3coins-net

  frontend:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_TARGET=http://backend:5000
    networks:
      - insert3coins-net

networks:
  insert3coins-net:
    driver: bridge
