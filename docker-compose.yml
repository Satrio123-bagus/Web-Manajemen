services:
  backend:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - PORT=8080
    networks:
      - insert3coins-net

  frontend:
    build: ./client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - insert3coins-net

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  insert3coins-net:
    driver: bridge
